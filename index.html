<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Galería Automática con Enlace de Imagen</title>
    <style>
        body {
            font-family: sans-serif;
            background-color: #1a1a1a;
            color: #fff;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* Cuadrícula de Imágenes */
        .image-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 20px;
            width: 100%;
            max-width: 1200px;
            padding: 10px;
            margin-top: 20px;
        }

        .grid-item {
            position: relative;
            overflow: hidden;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.3);
            aspect-ratio: 1 / 1;
            cursor: pointer;
            background: #111;
        }

        .grid-item img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.3s ease;
        }

        .grid-item:hover img {
            transform: scale(1.05);
        }

        /* Vista de Zoom (Modal) */
        .zoom-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(0, 0, 0, 0.85);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
            overflow: auto;
        }

        .zoom-overlay.active {
            opacity: 1;
            pointer-events: auto;
        }

        .zoom-content {
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
            width: 100%;
            height: 100%;
        }

        .zoom-overlay img {
            max-width: 90%;
            max-height: 90%;
            transform: scale(2);
            transition: transform 0.3s ease;
            border-radius: 4px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
        }

        .close-hint {
            position: fixed;
            top: 20px;
            left: 20px;
            background: rgba(255,255,255,0.2);
            padding: 8px 15px;
            border-radius: 20px;
            font-size: 14px;
            pointer-events: none;
            z-index: 1010;
        }

        .whatsapp-btn {
            position: fixed;
            bottom: 40px;
            background-color: #25D366;
            color: white;
            text-decoration: none;
            padding: 15px 25px;
            border-radius: 30px;
            font-weight: bold;
            font-size: 16px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.4);
            display: flex;
            align-items: center;
            gap: 10px;
            transition: transform 0.2s ease, background-color 0.2s ease;
            z-index: 1010;
            opacity: 0;
            transform: translateY(20px);
            pointer-events: none;
        }

        .zoom-overlay.active .whatsapp-btn {
            opacity: 1;
            transform: translateY(0);
            pointer-events: auto;
        }

        .whatsapp-btn:hover {
            background-color: #20ba5a;
            transform: scale(1.05);
        }

        .whatsapp-icon {
            width: 20px;
            height: 20px;
            fill: white;
        }
    </style>
</head>
<body>

    <h1>Mi Galería de Productos</h1>

    <div class="image-grid" id="image-grid"></div>

    <!-- Contenedor del Zoom -->
    <div class="zoom-overlay" id="zoom-overlay">
        <span class="close-hint">Haz clic en la imagen o fondo para cerrar</span>
        <div class="zoom-content" id="zoom-content">
            <img id="zoom-img" src="" alt="Zoom">
        </div>

        <a href="#" target="_blank" class="whatsapp-btn" id="whatsapp-btn">
            <svg class="whatsapp-icon" viewBox="0 0 24 24">
                <path d="M.057 24l1.687-6.163c-1.041-1.804-1.588-3.849-1.587-5.946C.06 5.348 5.4.01 12.008.01c3.202.001 6.212 1.246 8.477 3.516 2.266 2.27 3.507 5.28 3.505 8.484-.004 6.657-5.34 11.997-11.953 11.997-2.005-.001-3.973-.502-5.713-1.457L0 24zm6.59-4.846c1.6.95 3.188 1.449 4.825 1.451 5.436 0 9.86-4.37 9.864-9.799.002-2.623-1.023-5.086-2.884-6.949C16.528 2.013 14.069.99 11.45.99c-5.442 0-9.87 4.372-9.874 9.802-.001 1.73.463 3.423 1.343 4.927l-.997 3.645 3.725-.97z"/>
            </svg>
            Consultar por WhatsApp
        </a>
    </div>

    <script>
        const grid = document.getElementById('image-grid');
        const zoomOverlay = document.getElementById('zoom-overlay');
        const zoomImg = document.getElementById('zoom-img');
        const whatsappBtn = document.getElementById('whatsapp-btn');
        
        const TELEFONO_WHATSAPP = "50688424431"; 
        const MENSAJE_PREDEFINIDO = "Hola, me interesa obtener información sobre este producto de la galería:";

        // CONFIGURACIÓN: Lista de tus imágenes en GitHub
        const IMAGES_DIR = "imagenes/"; 
        const imagesList = [
            IMAGES_DIR + "producto1.jpg",
            IMAGES_DIR + "producto2.jpg",
            IMAGES_DIR + "producto3.jpg",
            IMAGES_DIR + "producto4.jpg",
            IMAGES_DIR + "producto5.jpg",
            IMAGES_DIR + "producto6.jpg",
            IMAGES_DIR + "producto7.jpg",
            IMAGES_DIR + "producto8.jpg",
            IMAGES_DIR + "producto9.jpg",
            IMAGES_DIR + "producto10.jpg",
        ];

        function renderGrid() {
            grid.innerHTML = '';
            imagesList.forEach((src) => {
                const item = document.createElement('div');
                item.className = 'grid-item';
                
                const img = document.createElement('img');
                img.src = src;
                
                img.onerror = () => { item.style.display = 'none'; };

                item.addEventListener('click', () => {
                    openZoom(src);
                });

                item.appendChild(img);
                grid.appendChild(item);
            });
        }

        function openZoom(src) {
            zoomImg.src = src;

            // Obtiene la dirección base pública en internet (ej: https://github.io)
            const urlBasePublica = window.location.href.split('?')[0];
            
            // Crea el enlace de internet completo hacia la imagen seleccionada
            const urlCompletaImagen = urlBasePublica + src;

            // Une el mensaje de texto original con el enlace público de la foto
            const mensajeCompleto = MENSAJE_PREDEFINIDO + "\n\n" + urlCompletaImagen;
            const textoCodificado = encodeURIComponent(mensajeCompleto);
            
            // Asigna el enlace definitivo
            whatsappBtn.href = "https://wa.me/" + TELEFONO_WHATSAPP + "/?text=" + textoCodificado;
            
            zoomOverlay.classList.add('active');
        }

        zoomOverlay.addEventListener('click', (e) => {
            if (!whatsappBtn.contains(e.target)) {
                zoomOverlay.classList.remove('active');
                setTimeout(() => { zoomImg.src = ''; }, 300);
            }
        });

        renderGrid();
    </script>
</body>
</html>
