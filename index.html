<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Galería con Zoom y Enlace a WhatsApp</title>
    <style>
        body {
            font-family: sans-serif;
            background-color: #1a1a1a;
            color: #fff;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* Panel de control */
        .upload-zone {
            margin-bottom: 30px;
            border: 2px dashed #555;
            padding: 20px;
            border-radius: 8px;
            background: #2a2a2a;
            text-align: center;
            width: 100%;
            max-width: 500px;
        }

        .upload-zone input {
            display: none;
        }

        .upload-btn {
            background: #007bff;
            color: white;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
            display: inline-block;
            margin-top: 10px;
        }

        /* Cuadrícula de Imágenes */
        .image-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 20px;
            width: 100%;
            max-width: 1200px;
            padding: 10px;
        }

        .grid-item {
            position: relative;
            overflow: hidden;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.3);
            aspect-ratio: 1 / 1;
            cursor: pointer;
            background: #111;
        }

        .grid-item img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.3s ease;
        }

        .grid-item:hover img {
            transform: scale(1.05);
        }

        /* Vista de Zoom (Modal) */
        .zoom-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(0, 0, 0, 0.85);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
            overflow: auto;
        }

        .zoom-overlay.active {
            opacity: 1;
            pointer-events: auto;
        }

        /* Contenedor interno para separar la imagen de los botones */
        .zoom-content {
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
            width: 100%;
            height: 100%;
        }

        .zoom-overlay img {
            max-width: 90%;
            max-height: 90%;
            transform: scale(2);
            transition: transform 0.3s ease;
            border-radius: 4px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
        }

        /* Indicador superior para cerrar */
        .close-hint {
            position: fixed;
            top: 20px;
            left: 20px;
            background: rgba(255,255,255,0.2);
            padding: 8px 15px;
            border-radius: 20px;
            font-size: 14px;
            pointer-events: none;
            z-index: 1010;
        }

        /* Botón de WhatsApp */
        .whatsapp-btn {
            position: fixed;
            bottom: 40px;
            background-color: #25D366;
            color: white;
            text-decoration: none;
            padding: 15px 25px;
            border-radius: 30px;
            font-weight: bold;
            font-size: 16px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.4);
            display: flex;
            align-items: center;
            gap: 10px;
            transition: transform 0.2s ease, background-color 0.2s ease;
            z-index: 1010;
            opacity: 0;
            transform: translateY(20px);
            pointer-events: none;
        }

        /* Mostrar botón solo cuando el zoom esté activo */
        .zoom-overlay.active .whatsapp-btn {
            opacity: 1;
            transform: translateY(0);
            pointer-events: auto;
        }

        .whatsapp-btn:hover {
            background-color: #20ba5a;
            transform: scale(1.05);
        }

        /* Icono SVG simple de WhatsApp */
        .whatsapp-icon {
            width: 20px;
            height: 20px;
            fill: white;
        }
    </style>
</head>
<body>

    <h1>Galería en Cuadrícula</h1>
    
    <div class="upload-zone">
        <p>Agrega imágenes para actualizar la cuadrícula al instante</p>
        <label class="upload-btn" for="file-input">Seleccionar Imágenes</label>
        <input type="file" id="file-input" accept="image/*" multiple>
    </div>

    <div class="image-grid" id="image-grid"></div>

    <!-- Contenedor del Zoom -->
    <div class="zoom-overlay" id="zoom-overlay">
        <span class="close-hint">Haz clic en la imagen o fondo para cerrar</span>
        
        <div class="zoom-content" id="zoom-content">
            <img id="zoom-img" src="" alt="Zoom">
        </div>

        <!-- Botón de WhatsApp fuera del flujo de clic de cierre -->
        <a href="#" target="_blank" class="whatsapp-btn" id="whatsapp-btn">
            <svg class="whatsapp-icon" viewBox="0 0 24 24">
                <path d="M.057 24l1.687-6.163c-1.041-1.804-1.588-3.849-1.587-5.946C.06 5.348 5.4.01 12.008.01c3.202.001 6.212 1.246 8.477 3.516 2.266 2.27 3.507 5.28 3.505 8.484-.004 6.657-5.34 11.997-11.953 11.997-2.005-.001-3.973-.502-5.713-1.457L0 24zm6.59-4.846c1.6.95 3.188 1.449 4.825 1.451 5.436 0 9.86-4.37 9.864-9.799.002-2.623-1.023-5.086-2.884-6.949C16.528 2.013 14.069.99 11.45.99c-5.442 0-9.87 4.372-9.874 9.802-.001 1.73.463 3.423 1.343 4.927l-.997 3.645 3.725-.97z"/>
            </svg>
            Consultar por WhatsApp
        </a>
    </div>

    <script>
        const fileInput = document.getElementById('file-input');
        const grid = document.getElementById('image-grid');
        const zoomOverlay = document.getElementById('zoom-overlay');
        const zoomContent = document.getElementById('zoom-content');
        const zoomImg = document.getElementById('zoom-img');
        const whatsappBtn = document.getElementById('whatsapp-btn');
        
        // CONFIGURACIÓN: Ingresa aquí tu número con código de país (ej: 52123456789)
        const TELEFONO_WHATSAPP = "50688424431"; 
        const MENSAJE_PREDEFINIDO = "Hola, me interesa obtener información sobre este producto de la galería.";

        let imagesList = [];

        fileInput.addEventListener('change', (e) => {
            const files = e.target.files;
            for (let file of files) {
                const blobUrl = URL.createObjectURL(file);
                imagesList.push(blobUrl);
            }
            renderGrid();
        });

        function renderGrid() {
            grid.innerHTML = '';
            imagesList.forEach((src) => {
                const item = document.createElement('div');
                item.className = 'grid-item';
                
                const img = document.createElement('img');
                img.src = src;

                item.addEventListener('click', () => {
                    openZoom(src);
                });

                item.appendChild(img);
                grid.appendChild(item);
            });
        }

        function openZoom(src) {
            zoomImg.src = src;
            
            // CORRECCIÓN: Se añade la barra '/' después de wa.me y se concatena correctamente la variable
            const textoCodificado = encodeURIComponent(MENSAJE_PREDEFINIDO);
            whatsappBtn.href = "https://wa.me/" + TELEFONO_WHATSAPP + "/?text=" + textoCodificado;
            
            zoomOverlay.classList.add('active');
        }

        // El modal se cierra si haces clic en el fondo o en la imagen, pero NO en el botón de WhatsApp
        zoomOverlay.addEventListener('click', (e) => {
            if (!whatsappBtn.contains(e.target)) {
                zoomOverlay.classList.remove('active');
                setTimeout(() => { zoomImg.src = ''; }, 300);
            }
        });
    </script>
</body>
</html>
